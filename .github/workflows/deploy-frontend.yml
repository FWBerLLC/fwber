name: Deploy Frontend (Hetzner)

on:
  push:
    branches: [main]
    paths:
      - "fwber-frontend/**"
      - "ops/hetzner/scripts/deploy-frontend.sh"
      - "VERSION"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Verify & Deploy Frontend to Hetzner (.standalone-live)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify UTF-8 BOM, Nav Coverage & API Contracts
        run: |
          python3 tools/verify_no_bom.py
          python3 tools/check_nav_coverage.py
          python3 tools/check_api_contracts.py

      - name: Deploy Frontend Zero-Downtime on Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          HETZNER_PROJECT_PATH: ${{ secrets.HETZNER_PROJECT_PATH }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          envs: HETZNER_PROJECT_PATH
          script: |
            set -euo pipefail
            REPO_ROOT="${HETZNER_PROJECT_PATH:-/var/www/fwber/repo}"
            cd "$REPO_ROOT"
            # Preserve untracked server-side directories (prisma/migrations/ and uploads/)
            # — NEVER run `git clean -fd` or `git stash --include-untracked`.
            git tag -f "rollback/pre-deploy-$(date +%Y%m%d)-$(git rev-parse --short HEAD)" "$(git rev-parse HEAD)" 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            # Build at `nice -n 10` and atomically swap `.standalone-next` -> `.standalone-live`
            bash ops/hetzner/scripts/deploy-frontend.sh
            echo "✅ Zero-downtime frontend deployment complete"
