name: Container Publish (Manual)

on:
  workflow_dispatch:
    inputs:
      publish_backend:
        description: 'Build and publish the fwber-backend-ts image'
        required: false
        default: 'false'
      publish_geo:
        description: 'Build and publish the fwber-geo Rust sidecar image'
        required: false
        default: 'false'
      publish_frontend:
        description: 'Build and publish the fwber-frontend standalone image'
        required: false
        default: 'false'

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current deployment topology
        run: |
          echo "Primary production deployment is All-Hetzner Unified Stack (5.161.250.43 / fwber.online):"
          echo "  - fwber-frontend (.standalone-live :3000) via .github/workflows/deploy-frontend.yml"
          echo "  - fwber-backend-ts (Express/Prisma/Socket.IO :4003) via .github/workflows/deploy-backend.yml"
          echo "  - fwber-geo (Actix-Web Rust geohash engine :8081)"
          echo "This manual workflow builds optional Docker images for self-hosted / Kubernetes deployments."

  build-docker-backend:
    needs: summary
    if: ${{ github.event.inputs.publish_backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push fwber-backend-ts
        uses: docker/build-push-action@v5
        with:
          context: ./fwber-backend-ts
          file: ./fwber-backend-ts/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fwber-backend-ts:latest

  build-docker-geo:
    needs: summary
    if: ${{ github.event.inputs.publish_geo == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push fwber-geo
        uses: docker/build-push-action@v5
        with:
          context: ./fwber-geo
          file: ./fwber-geo/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fwber-geo:latest

  build-docker-frontend:
    needs: summary
    if: ${{ github.event.inputs.publish_frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push fwber-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./fwber-frontend/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fwber-frontend:latest
