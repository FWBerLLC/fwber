name: Secret Scan (gitleaks)

# ChatGPT roast remediation #1 (credential hygiene): scan every push and
# PR for leaked secrets. Live keys were pasted into agent chats during
# bring-up; this gate makes committing one a red build instead of a
# postmortem. Rotation of already-exposed credentials stays an owner task.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (CLI, no license needed)
        run: |
          GL_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1
