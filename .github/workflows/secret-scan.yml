name: Secret Scan (gitleaks)

# ChatGPT roast remediation #1 (credential hygiene): scan every push and
# PR for leaked secrets. Live keys were pasted into agent chats during
# bring-up; this gate makes committing one a red build instead of a
# postmortem. Rotation of already-exposed credentials stays an owner task.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (CLI, no license needed)
        run: |
          GL_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # Scan only the new range: the full history carries 318 legacy
          # findings (reported as exposure for owner rotation; git history
          # is never rewritten). The gate's job is stopping NEW leaks.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-1"
          fi
          echo "Scanning range: $RANGE"
          ./gitleaks detect --source . --redact --exit-code 1 --log-opts="$RANGE"
