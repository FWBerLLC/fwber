name: Secret Scan (gitleaks)

# ChatGPT roast remediation #1 (credential hygiene): scan every push and
# PR for leaked secrets. Live keys were pasted into agent chats during
# bring-up; this gate makes committing one a red build instead of a
# postmortem. Rotation of already-exposed credentials stays an owner task.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
